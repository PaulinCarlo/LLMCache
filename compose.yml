services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: promptcache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["services"]
    build:
      context: ./src/LLMCache.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=promptcache;Username=postgres;Password=postgres"
      Embeddings__Provider: "openai"
      Embeddings__Model: "text-embedding-3-small"
      Embeddings__ApiKey: "${OPENAI_API_KEY:-}"
      Delta__Provider: "google"
      Delta__Model: "gemini-1.5-flash"
      Delta__ApiKey: "${GOOGLE_API_KEY:-}"
      AllowedOrigins__0: "http://localhost:3000"
      AllowedOrigins__1: "http://localhost:5173"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro

volumes:
  pgdata:
