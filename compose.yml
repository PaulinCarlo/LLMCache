services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: promptcache
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["services"]
    build:
      context: .
      dockerfile: ./src/LLMCache.Api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=promptcache;Username=postgres;Password=postgres"
      Embeddings__Provider: "openai"
      Embeddings__Model: "text-embedding-3-small"
      Embeddings__ApiKey: "${OPENAI_API_KEY:-}"
      Delta__Provider: "google"
      Delta__Model: "gemini-1.5-flash"
      Delta__ApiKey: "${GOOGLE_API_KEY:-}"
      AllowedOrigins__0: "http://localhost:3001"
      FrontendUrl: "http://localhost:3001"
      ASPNETCORE_ENVIRONMENT: "Production"
    depends_on:
      db:
        condition: service_healthy

  # 1. Loki: The log database
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # 2. OpenTelemetry Collector: The processor
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro,Z
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki

  # 3. Grafana: The dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
      

volumes:
  pgdata:
